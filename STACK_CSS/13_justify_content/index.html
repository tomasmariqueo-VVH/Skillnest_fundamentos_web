<!DOCTYPE html>
<html lang="en">

<head>

    <title>Justify Content (CSS)</title>
    <meta name="author" content="Tomás Mariqueo">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="container">
        <div class="titulo">
            <h2>Justify Content: flex-start</h2>
        </div>

            <img src="static/images/squirtle.png" alt="Squirtle">

    </div>
    <div class="container">

        </div>

        </div>
