<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de perfil</title>
    <meta name="author" content="Tomás Mariqueo">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="barra_nav">
            <div class="logo">
                <h1>Perfil</h1>
            </div>
            <div class="enlace">
                <a href="#">inicio</a>
                <a href="#">Mi perfil</a>
                <a href="#">Conexiones</a>
                <button class="boton">Cerrar sesión</button>
            </div>
        </nav>
    </header>
    <main class="contenedor_principal">
        <section class="columna_izquierda">
            <div class="tarjeta">
                <div class="superior_tarjeta"></div>
                <div class="descripcion_tarjeta">
                    <div class="contenedor_imagen">
                        <img class="imagen" src="static/images/user-icon.png" alt="perfil">
                    </div>
                    <h1>Jane Doe</h1>
                    <p class="parrafo1">Bergen, Noruega</p>
                    <p class="parrafo2">Desarrolladora Frontend</p>
                    <p class="parrafo2">Conocimientos en HTML, CSS y JavaScript</p>
                    <a class="click" href="#">⚙ Editar perfil</a>
                </div>
            </div>
        </section>
        <section class="columna_derecha">
            <div class="tarjeta_conexiones">
                <div class="row">
                </div>
                <div class="row">
                    <h2>Solicitudes de conexión</h2>
                    <button class="ver">Ver todas</button>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="perfil">
                    <p>Steve Jobs ✅ ❌</p>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="perfil">
                    <p>Bill Gates ✅ ❌</p>
                </div>
            </div>
            <div class="tarjeta_conexiones">
                <div class="row">
                    <h2>Tus conexiones</h2>
                    <button class="ver">Ver todas</button>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="perfil">
                    <p>Richard Stallman</p>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="perfil">
                    <p>Linus Torvalds</p>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="perfil">
                    <p>Ada Lovelace</p>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="perfil">
                    <p>Grace Hopper</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
