<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de arte</title>
    <meta name="author" content="Tomás Mariqueo">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>La galería de arte</h1>
            </div>
            <div>
                <input class="buscador" type="text" placeholder="Buscar arte...">
            </div>
            <div>
                <button class="sesion">Iniciar sesión</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="galeria">
            <div class="contenedorImg">
                <img id="campo" src="static/images/campo-de-trigo-con-cipreses.png" alt="">
            </div>
            <h3 id="texto">Campo de trigo con cipreces, Vicent van Gogh (1889)</h3>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
