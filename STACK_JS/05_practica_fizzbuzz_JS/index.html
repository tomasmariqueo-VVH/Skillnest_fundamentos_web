<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="static/css/style.css">
    <title>Desafío FizzBuzz</title>
</head>

<body>
    <div class="contenedor">
        <h1>FizzBuzz</h1>
        <div class="card">
            <h2>Reglas FizzBuzz</h2>
            <ul>
                <li>si un numero es divisiple por 3: muestra "Fizz".</li>
                <li>si un numero es divisiple por 5: muestra "Buzz".</li>
                <li>si un numero es divisiple por ambos 3 y 5: muestra "FizzBuzz".</li>
                <li>si no cumple con ninguna condición, muestra el número sin más.</li>
            </ul>
            <button onclick="fizzBuzz()">Ejecutar</button>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>
