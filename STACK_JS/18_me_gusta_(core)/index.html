<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tomás Mariqueo">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Social Like</title>
</head>

<body>
    <header>
        <nav class="nav">
            <h1 class="logo">Social Like</h1>
        </nav>
    </header>
    <main>
        <div class="izquierdo">
            <div class="perfil">
                <img src="static/images/misato.png" alt="fotoPerfil">
                <h3>Misato</h3>
                <button>Mi perfil</button>
            </div>
        </div>
        <div class="derecho">
            <h2>Ultimas publicaciones</h2>
            <div class="publicaciones">
                <div class="publicacion">
                    <div class="texto">
                        <h3>Rei</h3>
                        <p>Acabo de configurar este nuevo <a href="https://discord.com/">
                                bot de discord</a>, cuéntame que opinan ustedes.
                        </p>
                    </div>
                    <div class="likes">
                        <p id="contador1">0 Like(s)</p>
                        <button id="boton1">Like</button>
                    </div>
                </div>
                <div class="publicacion">
                    <div class="texto">
                        <h3>Asuka</h3>
                        <p>Acabo de leer este <a
                                href="https://encyclopedia.ushmm.org/content/es/article/mein-kampf">
                                nuevo cómic</a>. Denle un vistazo.</p>
                    </div>
                    <div class="likes">
                        <p id="contador2">0 Like(s)</p>
                        <button id="boton2">Like</button>
                    </div>
                </div>
                <div class="publicacion">
                    <div class="texto">
                        <h3>Shinji</h3>
                        <p>
                            No puedo dejar de escuchar este <a href="https://www.losbunkers.cl/">album</a>.
                            ¿A quién más le gusta?</p>
                    </div>
                    <div class="likes">
                        <p id="contador3">0 Like(s)</p>
                        <button id="boton3">Like</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
