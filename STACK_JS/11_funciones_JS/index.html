<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tomás Mariqueo">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Funciones JS</title>
</head>

<body>
    <div class="contenedor">
        <h1>Funciones en JS</h1>
        <div class="card">
            <h2>Ejemplo 1</h2>
            <p>Funcion sin parámetros: Saludar</p>
            <button onclick="saludarme()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo 2</h2>
            <p>Funcion con parámetros.</p>
            <button onclick="saludarParam(`Tomás`)">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo 3</h2>
            <p>Encontrar el número mayor.</p>
            <button onclick="encontrarMayor()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Tarea</h2>
            <p>Suma de valores</p>
            <button onclick="operacion()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Tarea</h2>
            <p>Bucle</p>
            <button onclick="mostrarContador()">Ejecutar</button>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>

</html>
