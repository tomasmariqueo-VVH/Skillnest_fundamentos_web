<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/style.css">
    <meta name="author" content="Tomás Mariqueo">
    <title>Taco Palace</title>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <img src="static/images/logo.png" alt="taco" class="taco">
                <h2 class="nombre"><span>Taco</span>Palace</h2>
            </div>
            <div class="derecha">
                <div class="input">
                    <input type="text" placeholder="Email">
                    <button>Login</button>
                </div>
                <div class="compras">
                    <img src="static/images/carrito.png" alt="el_carro">
                    <p id="compras">0</p>
                </div>
            </div>
        </nav>
    </header>
    <main class="main">
        <div class="principal">
            <div class="productos">
                <div class="caja">
                    <img src="static/images/enchiladas.png" alt="enchiladas">
                    <h3>Enchiladas</h3>
                </div>
                <div class="caja">
                    <img src="static/images/tacos.png" alt="tacos">
                    <h3>Tacos</h3>
                </div>
                <div class="caja">
                    <img src="static/images/flautas.png" alt="flautas">
                    <h3>Flautas</h3>
                </div>
                <div class="caja">
                    <img src="static/images/gorditas.png" alt="gorditas">
                    <h3>Gorditas</h3>
                </div>
                <div class="caja">
                    <img src="static/images/tostadas.png" alt="tostadas">
                    <h3>Tostadas</h3>
                </div>
                <div class="caja">
                    <img src="static/images/enfrijoladas.png" alt="enfrijoladas">
                    <h3>Enfrijoladas</h3>
                </div>
            </div>

            <div class="principales">
                <div class="platillo_principal">
                    <div class="texto">
                        <p class="p1">La mejor variedad en platillos de comida <span class="negrita">mexicana</span></p>
                        <p class="p2">Contamos con <span class="linea">servicio</span> a <span class="naranja">domicilio</span></p>
                    </div>
                    <div class="imagenes">
                        <img src="static/images/comida-mexicana.png" alt="comida-mexicana">
                    </div>
                </div>

                <div class="recomendaciones">
                    <h1>Recomendados</h1>
                    <div class="recomendacion">
                        <img src="static/images/orden-tacos.png" alt="orden-tacos">
                        <div class="abajo">
                            <div class="texto2">
                                <p>Orden de Tacos</p>
                                <a href="#">Ver Más...</a>
                            </div>
                            <div class="boton">
                                <button>+</button>
                            </div>
                        </div>
                    </div>
                    <div class="recomendacion">
                        <img src="static/images/orden-flautas.png" alt="orden-flautas">
                        <div class="abajo">
                            <div class="texto2">
                                <p>Orden de Flautas</p>
                                <a href="#">Ver Más...</a>
                            </div>
                            <div class="boton">
                                <button>+</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
